version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: rag_redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:///./app.db
      - QDRANT_PATH=./qdrant_data
    volumes:
      - .:/app  # Mounts local directory for live-reloading / data persistence
    depends_on:
      - redis